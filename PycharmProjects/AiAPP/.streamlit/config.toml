[theme]
base = "dark"

# Nova AI football identity
primaryColor = "#00E676"
backgroundColor = "#080C12"
secondaryBackgroundColor = "#121A24"
textColor = "#F5F7FA"
borderColor = "#263241"

# Links and highlights
linkColor = "#00E676"
linkUnderline = true

# Code blocks
codeBackgroundColor = "#0D131C"
codeTextColor = "#B9F6CA"

# Tables
dataframeBorderColor = "#263241"
dataframeHeaderBackgroundColor = "#121A24"

# Fonts
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"

baseFontSize = 16
baseFontWeight = 400
codeFontSize = "0.9rem"
codeFontWeight = 400

# More professional UI shapes
baseRadius = "medium"
buttonRadius = "medium"

showWidgetBorder = true
showSidebarBorder = true

# Metrics
metricValueFontSize = "2rem"
metricValueFontWeight = 700

# Nova colors:
# Green = football pitch
# Gold = elite performance
# Blue = analysis/data
chartCategoricalColors = [
    "#00E676",
    "#FFD740",
    "#29B6F6",
    "#FF7043",
    "#B388FF"]